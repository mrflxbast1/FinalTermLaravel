[PHP]
engine = On
short_open_tag = Off
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 60
default_charset = UTF-8
date.timezone = Asia/Manila
extension = curl
extension = fileinfo
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = zip
